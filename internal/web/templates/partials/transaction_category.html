{{define "transaction_category"}}
<form class="category-quick" hx-patch="/api/transactions/{{.Transaction.ID}}/category" hx-target="this" hx-swap="outerHTML" hx-trigger="change from:.category-select">
  <span class="badge category {{categoryClass .Transaction.Category}} category-quick-badge">
    <select name="category" class="category-select" aria-label="Category for transaction {{.Transaction.ID}}" title="{{.Transaction.Category}} — change category">
      {{$current := .Transaction.Category}}
      {{range .Categories}}
        <option value="{{.}}" {{if eq . $current}}selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </span>
  <span class="category-remember">
    <input type="hidden" name="remember" value="0">
    <input id="remember-{{.Transaction.ID}}" type="checkbox" name="remember" value="1" checked>
    <label for="remember-{{.Transaction.ID}}" title="Uncheck for a one-off variable utility bill or a single transfer">Remember for all transfers to this person</label>
  </span>
</form>
{{end}}
