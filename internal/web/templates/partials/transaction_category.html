{{define "transaction_category"}}
<div class="category-quick-shell" id="category-quick-{{.Transaction.ID}}">
  <form class="category-quick" hx-patch="/api/transactions/{{.Transaction.ID}}/category" hx-target="closest .category-quick-shell" hx-swap="outerHTML" hx-trigger="change from:.category-select">
    <span class="badge category {{categoryClass .Transaction.Category}} category-quick-badge">
      <select name="category" class="category-select" aria-label="Category for transaction {{.Transaction.ID}}" title="{{.Transaction.Category}} — change category">
        {{$current := .Transaction.Category}}
        {{range .Categories}}
          <option value="{{.}}" {{if eq . $current}}selected{{end}}>{{.}}</option>
        {{end}}
      </select>
    </span>
    <span class="category-remember">
      <input type="hidden" name="remember" value="0">
      <input id="remember-{{.Transaction.ID}}" type="checkbox" name="remember" value="1" checked>
      <label for="remember-{{.Transaction.ID}}" title="Uncheck for a one-off variable utility bill or a single transfer">Remember for all transfers to this person</label>
    </span>
  </form>
  {{if .Suggestion}}
    <button type="button" class="category-confirm-chip"
      hx-patch="/api/transactions/{{.Transaction.ID}}/category"
      hx-vals='{{printf "{\"category\":%q,\"remember\":\"1\"}" .Suggestion}}'
      hx-target="#category-quick-{{.Transaction.ID}}" hx-swap="outerHTML"
      title="Confirm the Bayesian suggestion and teach the classifier">
      ✓ {{.Suggestion}} · {{.SuggestionConfidence}}%
    </button>
  {{end}}
  {{if .QuickActions}}
    <div class="category-quick-actions" aria-label="Single-transaction categories">
      {{range .QuickActions}}
        <button type="button" class="category-quick-chip {{.Class}}"
          data-quick-category="{{.Category}}"
          hx-patch="/api/transactions/{{$.Transaction.ID}}/category"
          hx-vals='{{printf "{\"category\":%q,\"remember\":\"0\",\"quick\":\"1\"}" .Category}}'
          hx-target="#category-quick-{{$.Transaction.ID}}" hx-swap="outerHTML"
          title="Apply {{.Category}} to this transaction only">{{.Label}}</button>
      {{end}}
    </div>
  {{end}}
</div>
{{end}}
